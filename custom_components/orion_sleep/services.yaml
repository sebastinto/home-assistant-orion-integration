set_schedule:
  name: Set sleep schedule times
  description: >-
    Set the recurring bedtime and/or wake-up time on the Orion sleep schedule.
    Applies to every day of the week unless specific days are given.
  fields:
    bedtime:
      name: Bedtime
      description: Bedtime in 24-hour HH:MM format.
      example: "23:45"
      required: false
      selector:
        text:
    wakeup:
      name: Wake-up time
      description: Wake-up time in 24-hour HH:MM format.
      example: "07:45"
      required: false
      selector:
        text:
    days:
      name: Days
      description: >-
        Days of week to change, 0 = Sunday night. Defaults to all seven.
      example: "[0, 1, 2, 3, 4, 5, 6]"
      required: false
      selector:
        object:
    bedtime_is_active:
      name: Bedtime active
      description: Enable or disable the bedtime temperature change.
      required: false
      selector:
        boolean:
    wakeup_is_active:
      name: Wake-up active
      description: Enable or disable the wake-up temperature change.
      required: false
      selector:
        boolean:
    auto_turn_off:
      name: Auto turn off
      description: Turn the zone off 30 minutes after wake-up.
      required: false
      selector:
        boolean:
